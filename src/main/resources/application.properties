# Spring Datasource Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/annotation_app_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# Ou 'annotation_user' si tu l'as créé
spring.datasource.username=root
# REMPLACE CECI PAR TON VRAI MOT DE PASSE
spring.datasource.password=10022003@ilyas
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
# 'MySQLDialect' est souvent auto-détecté, mais c'est bien de le spécifier.
# Pour les versions récentes de Hibernate et MySQL, MySQLDialect est préféré à MySQL8Dialect ou MySQL5Dialect.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Garde 'update' pour le développement initial
spring.jpa.hibernate.ddl-auto=update
# Utile pour voir les requêtes SQL générées
spring.jpa.show-sql=true

# Thymeleaf Configuration (reste inchangé)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload Configuration (reste inchangé)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
