<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">
<head th:replace="~{fragments/header :: header-head}">
    <title>My Annotation Tasks - Annotation App</title>
</head>
<body class="with-fixed-navbar">
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">
    <div class="page-header-actions"> <!-- Même style de titre que les pages admin -->
        <h1>
            <i class="fas fa-tasks me-2"></i>Welcome, <span class="fw-semibold" th:text="${annotatorName}">Annotator</span>! Your Tasks
        </h1>
    </div>

    <!-- Messages Flash -->
    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${param.error == 'unauthorized'}" class="alert alert-warning" role="alert">
        <i class="fas fa-exclamation-triangle"></i> You are not authorized to view that task.
    </div>
    <div th:if="${param.error == 'task_already_completed'}" class="alert alert-info" role="alert">
        <i class="fas fa-info-circle"></i> That task has already been completed.
    </div>

    <div class="card">
        <div class="card-header">
            <i class="fas fa-list-ul me-2"></i>Pending Annotation Tasks
        </div>
        <div class="card-body">
            <table class="table table-hover" th:if="${tasks != null and not #lists.isEmpty(tasks)}"> <!-- table-hover pour effet au survol -->
                <thead>
                <tr>
                    <th style="width: 10%;" class="text-center">Task ID</th>
                    <th style="width: 25%;">Dataset Name</th>
                    <th style="width: 25%;">Text1 (Preview)</th>
                    <th style="width: 25%;">Text2 (Preview)</th>
                    <th style="width: 15%;" class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${tasks}">
                    <td class="text-center fw-medium" th:text="${task.id}"></td>
                    <td th:text="${task.dataset.name}" class="fw-semibold"></td>
                    <td th:text="${#strings.abbreviate(task.textPair.text1, 60)}" class="small text-muted"></td>
                    <td th:text="${#strings.abbreviate(task.textPair.text2, 60)}" class="small text-muted"></td>
                    <td class="text-end">
                        <a th:href="@{/annotator/tasks/{annotationId}/annotate(annotationId=${task.id})}"
                           class="btn btn-primary btn-sm"> <!-- Utilisation de la couleur primaire -->
                            <i class="fas fa-pencil-alt me-1"></i>Annotate
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${tasks == null or #lists.isEmpty(tasks)}" class="text-center py-5">
                <i class="fas fa-check-double fa-4x text-success mb-3"></i>
                <h4 class="fw-light">No pending tasks.</h4>
                <p class="text-muted">Well done, you're all caught up!</p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer-scripts}"></div>
</body>
</html>
