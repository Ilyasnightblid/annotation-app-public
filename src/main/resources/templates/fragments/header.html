<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header-head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- IMPORTANT pour Bootstrap -->
    <title>Annotation App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome CSS (pour les icônes) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Ton style.css personnalisé (doit être après Bootstrap pour surcharger) -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Dans <head th:fragment="header-head"> de templates/fragments/header.html -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" th:fragment="navbar"> <!-- navbar-expand-lg pour BS5 -->
    <div class="container-fluid"> <!-- Utiliser container-fluid pour la navbar pleine largeur -->
        <a class="navbar-brand fw-bold" th:href="@{/}">AnnotationApp</a> <!-- fw-bold pour gras en BS5 -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain"> <!-- id différent pour éviter conflits si plusieurs navbars -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0"> <!-- me-auto et ajustements de marge pour BS5 -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <!-- Lien 'Home' peut pointer vers le dashboard approprié ou une page d'accueil générale -->
                    <a class="nav-link" th:href="${#authorization.expression('hasRole(''ADMIN'')') ? '/admin/dashboard' : '/annotator/dashboard'}">
                        <i class="fas fa-home me-1"></i>Home
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">
                        <i class="fas fa-tachometer-alt me-1"></i>Admin Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/datasets}">
                        <i class="fas fa-database me-1"></i>Datasets
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/annotators}">
                        <i class="fas fa-users-cog me-1"></i>Annotators
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ANNOTATOR')">
                    <a class="nav-link" th:href="@{/annotator/dashboard}">
                        <i class="fas fa-tasks me-1"></i>My Tasks
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0"> <!-- ms-auto pour aligner à droite en BS5 -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                        <span class="navbar-text text-white me-3">
                            Welcome, <strong sec:authentication="principal.username">User</strong>!
                            <!-- Note: j'ai utilisé principal.username, qui est plus standard que 'name' pour UserDetails -->
                        </span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-flex">
                        <button type="submit" class="btn btn-outline-light">
                            <i class="fas fa-sign-out-alt me-1"></i>Logout
                        </button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="fas fa-sign-in-alt me-1"></i>Login
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
