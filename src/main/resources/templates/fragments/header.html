<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header-head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Annotation App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Ton style.css personnalisé -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm" th:fragment="navbar">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold"
           th:href="${#authorization.expression('isAuthenticated()') ? (#authorization.expression('hasRole(''ADMIN'')') ? '/admin/dashboard' : '/annotator/dashboard') : '/login'}">AnnotationApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link"
                       th:with="currentUri=${#httpServletRequest != null ? #httpServletRequest.requestURI : ''}"
                       th:classappend="${currentUri.startsWith('/admin/dashboard') or currentUri.startsWith('/annotator/dashboard') or currentUri.equals('/')} ? 'active' : ''"
                       th:href="${#authorization.expression('hasRole(''ADMIN'')') ? '/admin/dashboard' : '/annotator/dashboard'}">
                        <i class="fas fa-home me-1"></i>Home
                    </a>
                </li>
                <!-- Menu Admin -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link"
                       th:with="currentUri=${#httpServletRequest != null ? #httpServletRequest.requestURI : ''}"
                       th:classappend="${currentUri.startsWith('/admin/datasets')} ? 'active' : ''"
                       th:href="@{/admin/datasets}">
                        <i class="fas fa-database me-1"></i>Datasets
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link"
                       th:with="currentUri=${#httpServletRequest != null ? #httpServletRequest.requestURI : ''}"
                       th:classappend="${currentUri.startsWith('/admin/annotators')} ? 'active' : ''"
                       th:href="@{/admin/annotators}">
                        <i class="fas fa-users-cog me-1"></i>Annotators
                    </a>
                </li>

                <!-- Menu Annotateur -->
                <li class="nav-item" sec:authorize="hasRole('ANNOTATOR')">
                    <a class="nav-link"
                       th:with="currentUri=${#httpServletRequest != null ? #httpServletRequest.requestURI : ''}"
                       th:classappend="${currentUri.startsWith('/annotator/dashboard') or currentUri.startsWith('/annotator/tasks')} ? 'active' : ''"
                       th:href="@{/annotator/dashboard}">
                        <i class="fas fa-tasks me-1"></i>My Tasks
                    </a>
                </li>
                <!-- Le lien My Profile est maintenant dans le dropdown utilisateur plus bas -->
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">
                        <i class="fas fa-sign-in-alt me-1"></i>Login
                    </a>
                </li>

                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-user-circle me-1"></i><span sec:authentication="principal.username">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li sec:authorize="hasRole('ANNOTATOR')">
                            <a class="dropdown-item"
                               th:with="currentUri=${#httpServletRequest != null ? #httpServletRequest.requestURI : ''}"
                               th:classappend="${currentUri.startsWith('/annotator/profile')} ? 'active' : ''"
                               th:href="@{/annotator/profile}">
                                <i class="fas fa-user-edit fa-fw me-2"></i>My Profile
                            </a>
                        </li>
                        <!-- Tu pourrais ajouter d'autres liens ici, ex: Settings -->
                        <li sec:authorize="hasRole('ANNOTATOR')"><hr class="dropdown-divider" th:if="${#lists.size(#authentication.authorities) > 0}"></li> <!-- Séparateur si lien profil existe -->
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="fas fa-sign-out-alt fa-fw me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
