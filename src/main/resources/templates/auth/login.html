<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"> <!-- Ajout de lang="fr" -->
<head th:replace="~{fragments/header :: header-head}">
    <title>Login - Annotation App</title>
</head>
<body class="login-page-split"> <!-- Nouvelle classe pour le body -->

<div class="login-split-container">
    <!-- Colonne de Gauche: Branding -->
    <div class="login-branding-column d-none d-lg-flex"> <!-- d-none d-lg-flex: visible seulement sur lg et plus grand -->
        <div> <!-- Conteneur interne pour un meilleur contrôle du contenu si besoin -->
            <div class="app-logo">AnnotationApp</div>

            <!-- Tu pourrais ajouter une image/illustration ici à la place ou en plus -->
            <!-- <img th:src="@{/images/login-illustration.svg}" alt="Annotation Illustration" style="max-width: 300px; margin-top: 2rem;"> -->
        </div>
    </div>

    <!-- Colonne de Droite: Formulaire de Login -->
    <div class="login-form-column">
        <div class="login-form-wrapper">
            <h1 class="form-title">Welcome Back!</h1>
            <p class="text-center text-muted mb-4">Please sign in to continue.</p>

            <!-- Messages d'erreur/succès -->
            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
                <i class="fas fa-times-circle me-2"></i> <!-- Icône différente pour erreur -->
                <div>Invalid username or password.</div>
            </div>
            <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <div>You have been logged out successfully.</div>
            </div>

            <form th:action="@{/login}" method="post" class="mt-2">
                <div class="form-floating mb-3">
                    <input type="text" id="username" name="username" class="form-control" placeholder="Username" required autofocus>
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                </div>
                <div class="form-floating mb-3"> <!-- mb-3 au lieu de mb-4 pour moins d'espace avant le bouton -->
                    <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                </div>

                <!-- Retiré la section "Remember me" et "Forgot password?" pour la simplicité, tu peux les remettre -->

                <div class="d-grid mt-4"> <!-- mt-4 pour espace avant le bouton -->
                    <button type="submit" class="btn btn-primary btn-lg btn-login">
                        Log In <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                </div>
            </form>

            <div class="login-form-footer">
                AnnotationApp © <span th:text="${#dates.year(#dates.createNow())}">2024</span>
                <!-- Optionnel: Lien vers une page d'inscription
                <p class="mt-2">Don't have an account? <a href="#!">Sign Up</a></p>
                -->
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle (essentiel si des composants JS de Bootstrap sont utilisés ailleurs, mais pas critique pour CE formulaire simple) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
