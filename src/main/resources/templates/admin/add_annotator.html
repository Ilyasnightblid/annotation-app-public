<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}"></head>
<body class="with-fixed-navbar">
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="container">
    <h2>Add New Annotator</h2>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <form th:action="@{/admin/annotators/add}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="username">Username (Login):</label>
            <input type="text" id="username" th:field="*{username}" class="form-control" required/>
            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger"></span>
        </div>
        <div class="form-group">
            <label for="prenom">First Name:</label>
            <input type="text" id="prenom" th:field="*{prenom}" class="form-control" required/>
        </div>
        <div class="form-group">
            <label for="nom">Last Name:</label>
            <input type="text" id="nom" th:field="*{nom}" class="form-control" required/>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" th:field="*{password}" class="form-control" required/>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></span>
            <small class="form-text text-muted">The password will be hashed. You can also implement auto-generation.</small>
        </div>
        <button type="submit" class="btn btn-success">Add Annotator</button>
        <a th:href="@{/admin/annotators}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
<div th:replace="~{fragments/footer :: footer-scripts}"></div>
</body>
</html>
