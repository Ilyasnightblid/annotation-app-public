<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: header-head}">
    <title>Manage Annotators</title>
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="container">
    <h2>Manage Annotators</h2>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <a th:href="@{/admin/annotators/new}" class="btn btn-primary mb-3">Add New Annotator</a>

    <table class="table table-striped" th:if="${annotators != null and not #lists.isEmpty(annotators)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username (Login)</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- On ne liste pas l'utilisateur admin lui-même pour modification/suppression -->
        <tr th:each="annotator : ${annotators}" th:if="${annotator.username != 'admin'}">
            <td th:text="${annotator.id}"></td>
            <td th:text="${annotator.username}"></td>
            <td th:text="${annotator.prenom}"></td>
            <td th:text="${annotator.nom}"></td>
            <td>
                <a th:href="@{/admin/annotators/edit/{id}(id=${annotator.id})}" class="btn btn-warning btn-sm">Edit</a>
                <a th:href="@{/admin/annotators/delete/{id}(id=${annotator.id})}"
                   class="btn btn-danger btn-sm"
                   th:attr="onclick='return confirm(\'Are you sure you want to delete annotator \\\'\' + ${annotator.username} + \'\\\'? This action cannot be undone.\');'">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:if="${annotators == null or #lists.isEmpty(annotators) or (#lists.size(annotators) == 1 and annotators[0].username == 'admin')}">
        <p class="text-center">No annotators (other than admin) found to manage.</p>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer-scripts}"></div>
</body>
</html>
