<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Include your existing header fragment -->
    <div th:replace="~{fragments/header :: header-head}"></div>
    <title>Create New Dataset</title>
    <!-- Add Font Awesome for Icons (replace with your preferred method if using a local copy) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Optional: Add some custom styles for spacing or illustration size */
        .dataset-illustration svg {
            max-width: 100%; /* Make SVG responsive within its column */
            height: auto;
            display: block; /* Prevent extra space below SVG */
            margin: auto; /* Center the SVG */
            /* You can add more styling here, e.g., fill colors if your SVG is simple */
        }
        .form-icon {
            margin-right: 8px; /* Space between icon and label */
            color: #007bff; /* Example icon color */
        }
        .card-header-title {
            font-size: 1.5rem; /* Larger title within card */
            font-weight: bold;
            color: #343a40;
        }
        .btn-spacing {
            margin-right: 10px; /* Space between buttons */
        }
    </style>
</head>
<body class="with-fixed-navbar">
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4 mb-4">
    <!-- Use a Bootstrap card for better visual structure -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-header-title">Create New Dataset</h2>
        </div>
        <div class="card-body">
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
            </div>

            <!-- Use a row to split content (form and illustration) on larger screens -->
            <div class="row">
                <!-- Form Column -->
                <div class="col-md-7 col-lg-8">
                    <form th:action="@{/admin/datasets/create}" th:object="${datasetCreateDto}" method="post" enctype="multipart/form-data">

                        <div class="form-group">
                            <label for="name"><i class="fas fa-database form-icon"></i>Dataset Name:</label>
                            <input type="text" id="name" th:field="*{name}" class="form-control" required/>
                            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></span>
                        </div>

                        <div class="form-group">
                            <label for="description"><i class="fas fa-align-left form-icon"></i>Description (Optional):</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="possibleClasses"><i class="fas fa-tags form-icon"></i>Possible Classes (separated by ";"):</label>
                            <input type="text" id="possibleClasses" th:field="*{possibleClasses}" class="form-control" placeholder="e.g., Positive;Negative;Neutral" required/>
                            <small id="classesHelp" class="form-text text-muted">Separate each class with a semicolon (`;`).</small>
                            <span th:if="${#fields.hasErrors('possibleClasses')}" th:errors="*{possibleClasses}" class="text-danger"></span>
                        </div>

                        <div class="form-group">
                            <label for="csvFile"><i class="fas fa-file-csv form-icon"></i>CSV File (with 'Text1' and 'Text2' columns):</label>
                            <!-- Using Bootstrap's custom file input if available, otherwise the standard form-control-file is fine -->
                            <div class="custom-file">
                                <input type="file" class="custom-file-input" id="csvFile" th:field="*{csvFile}" accept=".csv" required>
                                <label class="custom-file-label" for="csvFile">Choose file...</label>
                                <!-- JavaScript needed to show file name in label -->
                                <script>
                                    // Example: Update the custom file input label with the selected file name
                                    // This is a common Bootstrap pattern. You might need to add this script globally or ensure it's included.
                                    // Ensure this runs after the element is in the DOM.
                                    document.addEventListener('DOMContentLoaded', function() {
                                        var fileInput = document.getElementById('csvFile');
                                        if (fileInput) {
                                            fileInput.addEventListener('change', function() {
                                                var fileName = fileInput.files[0].name;
                                                var nextSibling = fileInput.nextElementSibling;
                                                if (nextSibling && nextSibling.classList.contains('custom-file-label')) {
                                                    nextSibling.innerText = fileName;
                                                }
                                            });
                                        }
                                    });
                                </script>
                            </div>
                            <small id="fileHelp" class="form-text text-muted">Upload a CSV file containing 'Text1' and 'Text2' columns.</small>
                            <span th:if="${#fields.hasErrors('csvFile')}" th:errors="*{csvFile}" class="text-danger d-block mt-1"></span> <!-- Use d-block for error span below file input -->
                        </div>

                        <hr class="mb-4 mt-4"> <!-- Separator before buttons -->

                        <button type="submit" class="btn btn-success btn-spacing"><i class="fas fa-plus-circle"></i> Create Dataset</button>
                        <a th:href="@{/admin/datasets}" class="btn btn-secondary"><i class="fas fa-times-circle"></i> Cancel</a>

                    </form>
                </div>

                <!-- Illustration Column -->
                <!-- Hide on small screens to save space -->
                <div class="col-md-5 col-lg-4 d-none d-md-block dataset-illustration">
                    <!-- Placeholder for an SVG illustration -->
                    <!-- You can replace this SVG with any other SVG related to data, files, or creation.
                         Search for free SVG illustrations on sites like unDraw, Pixabay, etc.
                         The key is that this is static UI content. -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                        <title>Data Visualization</title>
                        <style>
                            .data-chart { fill: #4682b4; } /* Steelblue */
                            .data-point { fill: #ffd700; } /* Gold */
                            .base-line { stroke: #333; stroke-width: 1; }
                        </style>
                        <!-- Simple Bar Chart Representation -->
                        <rect class="data-chart" x="10" y="40" width="15" height="50"></rect>
                        <rect class="data-chart" x="30" y="20" width="15" height="70"></rect>
                        <rect class="data-chart" x="50" y="50" width="15" height="40"></rect>
                        <rect class="data-chart" x="70" y="30" width="15" height="60"></rect>
                        <!-- X-axis -->
                        <line class="base-line" x1="5" y1="90" x2="95" y2="90"></line>
                        <!-- Y-axis -->
                        <line class="base-line" x1="5" y1="5" x2="5" y2="90"></line>

                        <!-- Optional: A few dots representing data points -->
                        <circle class="data-point" cx="17.5" cy="40" r="3"></circle>
                        <circle class="data-point" cx="37.5" cy="20" r="3"></circle>
                        <circle class="data-point" cx="57.5" cy="50" r="3"></circle>
                        <circle class="data-point" cx="77.5" cy="30" r="3"></circle>

                        <!-- Add a character or figure if you have one -->
                        <!-- For example, a simple circle head and stick figure body -->
                        <!-- <circle cx="85" cy="20" r="5" fill="#5cb85c"/>
                        <line x1="85" y1="25" x2="85" y2="40" stroke="#5cb85c" stroke-width="2"/>
                        <line x1="85" y1="30" x2="78" y2="35" stroke="#5cb85c" stroke-width="2"/>
                        <line x1="85" y1="30" x2="92" y2="35" stroke="#5cb85c" stroke-width="2"/>
                        <line x1="85" y1="40" x2="80" y2="50" stroke="#5cb85c" stroke-width="2"/>
                        <line x1="85" y1="40" x2="90" y2="50" stroke="#5cb85c" stroke-width="2"/> -->
                    </svg>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Include your existing footer scripts fragment -->
<div th:replace="~{fragments/footer :: footer-scripts}"></div>
</body>
</html>
