<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: header-head}"></head>
<body class="with-fixed-navbar">
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Admin Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Datasets</li>
        </ol>
    </nav>

    <!-- Dans admin/list_datasets.html -->
    <div class="page-header-actions">
        <h1>Datasets Overview</h1>
        <a th:href="@{/admin/datasets/new}" class="btn btn-lg btn-primary">
            <i class="fas fa-plus-circle me-2"></i>Create New Dataset
        </a>
    </div>

    <!-- Messages Flash -->
    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <i class="fas fa-check-circle"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-triangle"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="card">
        <div class="card-header">
            <i class="fas fa-list me-2"></i>All Datasets
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover" th:if="${datasets != null and not #lists.isEmpty(datasets)}">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>% Avancement</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dataset : ${datasets}">
                    <td th:text="${dataset.id}" class="text-center fw-medium"></td> <!-- fw-medium pour Bootstrap 5 si tu veux un gras léger -->
                    <td>
                        <a th:href="@{/admin/datasets/{id}(id=${dataset.id})}"
                           th:text="${dataset.name}"
                           class="fw-semibold text-decoration-none"></a> <!-- fw-semibold et text-decoration-none -->
                    </td>
                    <td th:text="${dataset.description != null ? #strings.abbreviate(dataset.description, 70) : 'N/A'}"
                        class="text-muted small"></td> <!-- text-muted et small pour la description -->
                    <td>
                        <!-- Barre de progression améliorée -->
                        <div class="progress" style="height: 22px; background-color: #e9ecef; border-radius: var(--bs-border-radius-sm); position: relative;">
                            <div class="progress-bar"
                                 role="progressbar"
                                 th:style="'width: ' + ${#strings.replace(progressPercentages.get(dataset.id), ',', '.')} + ';'"
                                 th:attr="aria-valuenow=${#strings.replace(#strings.replace(progressPercentages.get(dataset.id), '%', ''), ',', '.')}"
                                 aria-valuemin="0"
                                 aria-valuemax="100">
                                <!-- Le texte est maintenant dans un span dédié pour un meilleur contrôle via CSS -->
                                <span class="progress-bar-text" th:text="${progressPercentages.get(dataset.id)}"></span>
                            </div>
                        </div>
                    </td>
                    <!-- text-end pour aligner les boutons à droite (Bootstrap 5) -->
                    <td class="text-end">
                        <a th:href="@{/admin/datasets/{id}(id=${dataset.id})}"
                           class="btn btn-outline-primary btn-sm me-1"
                           title="View Details">
                            <i class="fas fa-eye me-1"></i>Details
                        </a>
                        <!-- Ajout de me-1 à la classe du lien ci-dessous -->
                        <a th:href="@{/admin/datasets/{id}/assign(id=${dataset.id})}"
                           class="btn btn-outline-secondary btn-sm me-1"
                           title="Assign Annotators">
                            <i class="fas fa-user-plus me-1"></i>Assign
                        </a>
                        <!-- BOUTON DE SUPPRESSION -->
                        <!-- BOUTON DE SUPPRESSION CORRIGÉ -->
                        <form th:action="@{/admin/datasets/delete/{id}(id=${dataset.id})}" method="post" style="display: inline-block;">
                            <button type="submit" class="btn btn-outline-danger btn-sm ms-1"
                                    th:attr="onclick= |return confirm('Are you sure you want to delete dataset ''${dataset.name}'' (ID: ${dataset.id})? This will also delete all its text pairs and annotations.')|"
                                    title="Delete Dataset">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${datasets == null or #lists.isEmpty(datasets)}" class="text-center py-4">
                <i class="fas fa-folder-open fa-3x text-muted mb-3"></i>
                <p class="lead">No datasets found.</p>
                <p>Why not <a th:href="@{/admin/datasets/new}">create one now</a>?</p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer-scripts}"></div>
</body>
</html>
