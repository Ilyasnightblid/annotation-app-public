<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">
<head th:replace="~{fragments/header :: header-head}">
    <title>Admin Dashboard - Annotation App</title>
    <style>
        /* Styles spécifiques au dashboard si besoin, en plus de style.css */
        .stat-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.12);
        }
        .stat-card .card-body {
            display: flex;
            align-items: center;
            padding: 1.5rem;
        }
        .stat-card .stat-icon {
            font-size: 2.5rem; /* Taille de l'icône */
            padding: 15px;
            border-radius: 50%; /* Cercle */
            margin-right: 1.5rem;
            width: 70px; /* Taille fixe pour l'icône */
            height: 70px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        /* Couleurs douces pour les fonds d'icônes */
        .stat-card .stat-icon.bg-primary-soft { background-color: rgba(var(--bs-primary-rgb), 0.1); color: var(--bs-primary); }
        .stat-card .stat-icon.bg-success-soft { background-color: rgba(var(--bs-success-rgb), 0.1); color: var(--bs-success); }
        .stat-card .stat-icon.bg-info-soft { background-color: rgba(var(--bs-info-rgb), 0.1); color: var(--bs-info); }
        .stat-card .stat-icon.bg-warning-soft { background-color: rgba(var(--bs-warning-rgb), 0.1); color: var(--bs-warning); }
        /* Ajout d'une couleur pour la nouvelle carte */
        .stat-card .stat-icon.bg-danger-soft { background-color: rgba(var(--bs-danger-rgb), 0.1); color: var(--bs-danger); }


        .stat-card .stat-content .stat-label {
            font-size: 0.85rem;
            color: var(--color-text-muted, #6c757d); /* Fallback color */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }
        .stat-card .stat-content .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-text, #212529); /* Fallback color */
        }
        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }
    </style>
</head>
<body class="with-fixed-navbar">
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="mb-4">Admin Dashboard</h1>
        <!-- Tu peux ajouter un bouton ici si besoin, ex: nouveau dataset -->
    </div>
    <p class="lead mb-5" sec:authorize="isAuthenticated()">
        Welcome back, <strong sec:authentication="principal.username">Administrator</strong>! Overview of your annotation projects.
    </p>

    <!-- 1. Cartes de Statistiques (MISES À JOUR) -->
    <div class="row mb-4 g-4">
        <div class="col-xl-3 col-md-6">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <div class="stat-icon bg-primary-soft">
                        <i class="fas fa-database"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Datasets</div>
                        <div class="stat-value" th:text="${datasetCount}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <div class="stat-icon bg-success-soft">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Annotators</div>
                        <div class="stat-value" th:text="${annotatorCount}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6"> <!-- NOUVELLE CARTE -->
            <div class="card stat-card h-100">
                <div class="card-body">
                    <div class="stat-icon bg-info-soft">
                        <i class="fas fa-tasks"></i> <!-- Icône pour les tâches totales -->
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Total Tasks (Pairs)</div>
                        <div class="stat-value" th:text="${totalTextPairs}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-3 col-md-6"> <!-- NOUVELLE CARTE -->
            <div class="card stat-card h-100">
                <div class="card-body">
                    <div class="stat-icon bg-warning-soft"> <!-- Ou bg-danger-soft -->
                        <i class="fas fa-check-double"></i> <!-- Icône pour les annotations complétées -->
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Completed Annotations</div>
                        <div class="stat-value" th:text="${totalCompletedAnnotations}">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. Diagramme de progression des datasets (RESTE IDENTIQUE) -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-chart-bar me-2"></i>Dataset Progress
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="datasetProgressChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <h3 class="mt-5 mb-3">Quick Actions</h3>
    <div class="list-group shadow-sm">
        <a th:href="@{/admin/datasets}" class="list-group-item list-group-item-action fs-5 py-3 px-4 d-flex justify-content-between align-items-center">
            <span><i class="fas fa-database fa-fw me-3 text-primary"></i>Manage Datasets</span>
            <i class="fas fa-chevron-right text-muted"></i>
        </a>
        <a th:href="@{/admin/annotators}" class="list-group-item list-group-item-action fs-5 py-3 px-4 d-flex justify-content-between align-items-center">
            <span><i class="fas fa-users-cog fa-fw me-3 text-success"></i>Manage Annotators</span>
            <i class="fas fa-chevron-right text-muted"></i>
        </a>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer-scripts}"></div>

<!-- Script pour initialiser le graphique Chart.js (RESTE IDENTIQUE) -->
<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function () {
        const ctx = document.getElementById('datasetProgressChart');
        if (ctx) {
            var datasetNames = /*[[${datasetNames}]]*/ [];
            var datasetProgressValues = /*[[${datasetProgressValues}]]*/ [];

            // Créer un dégradé pour les barres
            const chartCanvas = ctx.getContext('2d');
            let gradient;
            // Attendre que le graphique soit initialisé pour obtenir chartArea
            // Pour l'instant, on définit un dégradé simple, Chart.js l'appliquera
            gradient = chartCanvas.createLinearGradient(0, 0, 0, ctx.height || 300); // Hauteur par défaut si non dispo
            gradient.addColorStop(0, 'rgba(0, 123, 255, 0.8)');    // Bleu primaire Bootstrap
            gradient.addColorStop(1, 'rgba(106, 90, 205, 0.6)');   // SlateBlue (violet clair)

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: datasetNames,
                    datasets: [{
                        label: 'Completion %',
                        data: datasetProgressValues,
                        backgroundColor: gradient,
                        borderColor: 'rgba(0, 123, 255, 1)',
                        borderWidth: 1,
                        borderRadius: { topLeft: 5, topRight: 5, bottomLeft: 0, bottomRight: 0 }, // Coins arrondis en haut
                        barPercentage: 0.7, // Largeur relative des barres
                        categoryPercentage: 0.8 // Espacement entre les groupes de barres
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) { return value + "%" }
                            },
                            grid: {
                                // color: 'rgba(0,0,0,0.05)' // Lignes de grille plus claires
                            }
                        },
                        y: {
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true,
                            text: 'Dataset Progress (%)',
                            font: { size: 16, family: "'Poppins', sans-serif" },
                            padding: { bottom: 20 }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.formattedValue + '%';
                                }
                            }
                        }
                    }
                }
            });
        }
    });
    /*]]>*/
</script>
</body>
</html>
