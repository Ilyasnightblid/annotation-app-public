<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <title>Error</title>
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="container">
    <h1>Oops! Something went wrong.</h1>
    <p th:if="${status}" th:text="'Status: ' + ${status}"></p>
    <p th:if="${error}" th:text="'Error: ' + ${error}"></p>
    <p th:if="${message}" th:text="'Message: ' + ${message}"></p>
    <p><a th:href="@{/}">Go to Home Page</a></p>
</div>
<div th:replace="~{fragments/footer :: footer-scripts}"></div>
</body>
</html>
